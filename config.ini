[AGENTS]
AGENT_1_SUPPORT = False
AGENT_2_IT_HELPDESK = True
AGENT_3_FINANCE = False

; ─────────────────────────────────────────────────────────────────────────────
; QWEN MODELS
; Base directory that all Qwen model folder names are resolved relative to.
; ─────────────────────────────────────────────────────────────────────────────
[QWEN_MODELS]
qwen_models_dir = /home/ror-technologies/Quantization/models

; Qwen2.5 — 3B
Qwen2.5-3B-Instruct_FP16_Baseline       = True
Qwen2.5-3B-Instruct_FP8_Static_per_tensor = True
Qwen2.5-3B-Instruct_INT4_AWQ            = True
Qwen2.5-3B-Instruct_INT8_SmoothQuant    = False

; Qwen2.5 — 7B
Qwen2.5-7B-Instruct_FP16_Baseline       = True
Qwen2.5-7B-Instruct_FP8_Static_per_tensor = True
Qwen2.5-7B-Instruct_INT4_AWQ            = True
Qwen2.5-7B-Instruct_INT8_SmoothQuant    = False

; Qwen2.5 — 14B
Qwen2.5-14B-Instruct_FP16_Baseline      = True
Qwen2.5-14B-Instruct_FP8_Static_per_tensor = True
Qwen2.5-14B-Instruct_INT4_AWQ           = True

; ─────────────────────────────────────────────────────────────────────────────
; LLAMA MODELS
; Base directory that all Llama model folder names are resolved relative to.
; ─────────────────────────────────────────────────────────────────────────────
[LLAMA_MODELS]
llama_models_dir = /home/ror-technologies/IT-helpdesk-agent/quantized_models

; Llama-3.2 — 1B
meta-llama/Llama-3.2-1B-Instruct           = True
meta-llama__Llama-3.2-1B-Instruct-AWQ      = True
meta-llama__Llama-3.2-1B-Instruct-BNB-4bit = True
meta-llama__Llama-3.2-1B-Instruct-BNB-8bit = True
meta-llama__Llama-3.2-1B-Instruct-GPTQ-4bit = True
meta-llama__Llama-3.2-1B-Instruct-GPTQ-8bit = True

; Llama-3.2 — 3B
meta-llama/Llama-3.2-3B-Instruct           = True
meta-llama__Llama-3.2-3B-Instruct-AWQ      = True
meta-llama__Llama-3.2-3B-Instruct-BNB-4bit = True
meta-llama__Llama-3.2-3B-Instruct-BNB-8bit = True
meta-llama__Llama-3.2-3B-Instruct-GPTQ-4bit = True
meta-llama__Llama-3.2-3B-Instruct-GPTQ-8bit = True

; Meta-Llama-3 — 8B
meta-llama/Meta-Llama-3-8B-Instruct           = True
meta-llama__Meta-Llama-3-8B-Instruct-AWQ      = True
meta-llama__Meta-Llama-3-8B-Instruct-BNB-4bit = True
meta-llama__Meta-Llama-3-8B-Instruct-BNB-8bit = True
meta-llama__Meta-Llama-3-8B-Instruct-GPTQ-4bit = True
meta-llama__Meta-Llama-3-8B-Instruct-GPTQ-8bit = True

; ─────────────────────────────────────────────────────────────────────────────
; BENCHMARK SETTINGS
; ─────────────────────────────────────────────────────────────────────────────
[BENCHMARK]
use_vllm = False
repeated_trials = True
number_of_trials = 100
save_traces = False
output_dir = ./results
output_prefix = benchmark

; ─────────────────────────────────────────────────────────────────────────────
; INFERENCE SETTINGS
; Controls generation behaviour passed directly to the LLM engine.
; ─────────────────────────────────────────────────────────────────────────────
[INFERENCE]
; Sampling temperature — lower = more deterministic (0.0 = greedy)
temperature = 0.3
; Maximum number of new tokens to generate per LLM call
max_new_tokens = 512
; Whether to use sampling (True) or greedy decoding (False)
do_sample = True
; Nucleus sampling probability threshold (1.0 = disabled)
top_p = 0.95
; Maximum ReAct agent steps before forcing termination
max_steps = 15