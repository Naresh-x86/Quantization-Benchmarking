[AGENTS]
AGENT_1_SUPPORT = True
AGENT_2_IT_HELPDESK = False
AGENT_3_FINANCE = False

; ─────────────────────────────────────────────────────────────────────────────
; QWEN MODELS
; Base directory that all Qwen model folder names are resolved relative to.
; ─────────────────────────────────────────────────────────────────────────────
[QWEN_MODELS]
qwen_models_dir = /models/qwen

; Qwen2.5 — 3B
Qwen2.5-3B-Instruct_FP16_Baseline       = False
Qwen2.5-3B-Instruct_FP8_Static_per_tensor = True
Qwen2.5-3B-Instruct_INT4_AWQ            = False
Qwen2.5-3B-Instruct_INT8_SmoothQuant    = False

; Qwen2.5 — 7B
Qwen2.5-7B-Instruct_FP16_Baseline       = False
Qwen2.5-7B-Instruct_FP8_Static_per_tensor = False
Qwen2.5-7B-Instruct_INT4_AWQ            = False
Qwen2.5-7B-Instruct_INT8_SmoothQuant    = False

; Qwen2.5 — 14B
Qwen2.5-14B-Instruct_FP16_Baseline      = False
Qwen2.5-14B-Instruct_FP8_Static_per_tensor = False
Qwen2.5-14B-Instruct_INT4_AWQ           = False

; ─────────────────────────────────────────────────────────────────────────────
; LLAMA MODELS
; Base directory that all Llama model folder names are resolved relative to.
; ─────────────────────────────────────────────────────────────────────────────
[LLAMA_MODELS]
llama_models_dir = /models/llama

; Llama-3.2 — 1B
meta-llama/Llama-3.2-1B-Instruct           = True
meta-llama__Llama-3.2-1B-Instruct-AWQ      = False
meta-llama__Llama-3.2-1B-Instruct-BNB-4bit = False
meta-llama__Llama-3.2-1B-Instruct-BNB-8bit = False
meta-llama__Llama-3.2-1B-Instruct-GPTQ-4bit = False
meta-llama__Llama-3.2-1B-Instruct-GPTQ-8bit = False

; Llama-3.2 — 3B
meta-llama/Llama-3.2-3B-Instruct           = False
meta-llama__Llama-3.2-3B-Instruct-AWQ      = False
meta-llama__Llama-3.2-3B-Instruct-BNB-4bit = False
meta-llama__Llama-3.2-3B-Instruct-BNB-8bit = True
meta-llama__Llama-3.2-3B-Instruct-GPTQ-4bit = True
meta-llama__Llama-3.2-3B-Instruct-GPTQ-8bit = False

; Meta-Llama-3 — 8B
meta-llama/Meta-Llama-3-8B-Instruct           = False
meta-llama__Meta-Llama-3-8B-Instruct-AWQ      = False
meta-llama__Meta-Llama-3-8B-Instruct-BNB-4bit = False
meta-llama__Meta-Llama-3-8B-Instruct-BNB-8bit = False
meta-llama__Meta-Llama-3-8B-Instruct-GPTQ-4bit = False
meta-llama__Meta-Llama-3-8B-Instruct-GPTQ-8bit = False

; ─────────────────────────────────────────────────────────────────────────────
; BENCHMARK SETTINGS
; ─────────────────────────────────────────────────────────────────────────────
[BENCHMARK]
use_vllm = True
repeated_trials = True
number_of_trials = 100
save_traces = False
; Results are written to /results inside the container (bind-mounted to ./results on the host)
output_dir = /results
output_prefix = benchmark

; ─────────────────────────────────────────────────────────────────────────────
; INFERENCE SETTINGS
; ─────────────────────────────────────────────────────────────────────────────
[INFERENCE]
; Maximum number of new tokens to generate per step
max_new_tokens = 512
; Sampling temperature (lower = more deterministic)
temperature = 0.2
; Use sampling (True) vs greedy decoding (False)
do_sample = True
; Dedicated KV cache memory size (e.g. 256M, 512M, 1G, or auto).
; Using an explicit KV cache size prevents vLLM from pre-allocating
; 70-90% of the entire GPU VRAM, ensuring that measured VRAM strictly
; reflects model weights + runtime activations + actual KV cache.
kv_cache_memory = auto
; Fast warmup mode: disables CUDA graph capture (which compiles 86 graphs)
; and FlashInfer autotuning, reducing per-model startup from ~150s down to ~45-50s.
fast_warmup = True
; Fallback utilization if kv_cache_memory is disabled
gpu_memory_utilization = 0.7
; Maximum model context length (tokens).  Reduce if you hit OOM.
max_model_len = 4096