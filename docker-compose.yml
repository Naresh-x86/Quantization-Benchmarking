services:

  # ── Benchmark harness container ─────────────────────────────────────────────
  # This container holds the Python benchmark code and controls benchmark execution.
  # It does NOT auto-start the benchmark — you trigger it manually via:
  #
  #   docker compose up -d bench
  #   docker exec -it quant-bench bash /app/run_benchmark.sh
  #
  # main.py manages the vLLM server container (vllm-server) automatically per model.
  bench:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-bench
    image: quant-bench:latest

    # GPU passthrough — exposes all NVIDIA GPUs (RTX 5090)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Bind-mount host model directories (read-only) and the results directory
    volumes:
      # Local models directories on the host
      - /home/ror-technologies/Quantization/models:/models/qwen:ro
      - /home/ror-technologies/IT-helpdesk-agent/quantized_models:/models/llama:ro
      # HF cache directory on the host (where baseline unquantized Llama models live)
      - /home/ror-technologies/.cache/huggingface:/root/.cache/huggingface:ro
      # Results — written by main.py; accessible on the host at ./results
      - ./results:/results
      # Config and scripts on host
      - ./config.ini:/app/config.ini:ro
      - ./main.py:/app/main.py:ro
      - ./metrics.py:/app/metrics.py:ro
      # Socket so the container can launch sibling vLLM containers via the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock

    # Stay alive so we can exec commands into it
    stdin_open: true
    tty: true

    # Allow the benchmark container to talk to vLLM on localhost
    network_mode: host
    pid: host

    environment:
      - BENCHMARK_CONFIG=/app/config.ini
      - HF_HOME=/root/.cache/huggingface
      # Host paths passed down so spawned sibling vLLM container mounts the host filesystem correctly
      - HOST_MODELS_QWEN=/home/ror-technologies/Quantization/models
      - HOST_MODELS_LLAMA=/home/ror-technologies/IT-helpdesk-agent/quantized_models
      - HOST_HF_HOME=/home/ror-technologies/.cache/huggingface
      # Disable flashinfer JIT (fails on RTX 5090 compute_120a with older nvcc)
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
      - VLLM_USE_MODELSCOPE=False

    # Container stays running; benchmark is triggered manually
    command: ["/bin/bash"]
